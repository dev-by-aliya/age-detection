<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c33"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#4b41e1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4b41e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4566"/>
      <stop offset="0.55" stop-color="#2b3352"/>
      <stop offset="1" stop-color="#1d2440"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="1" stop-color="#6ffbbe" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="1.6" fill="#acedff" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <rect width="800" height="800" fill="url(#dots)"/>
  <!-- shoulders -->
  <path d="M400 560 C 300 560 210 620 180 720 L 170 800 L 630 800 L 620 720 C 590 620 500 560 400 560 Z" fill="url(#skin)"/>
  <!-- neck -->
  <rect x="355" y="470" width="90" height="120" rx="30" fill="#232b4a"/>
  <!-- head -->
  <ellipse cx="400" cy="350" rx="135" ry="155" fill="url(#skin)"/>
  <!-- hair shape -->
  <path d="M265 350 C 260 240 320 180 400 180 C 480 180 540 240 535 350 C 530 300 505 260 470 250 C 480 285 470 300 455 295 C 430 250 350 240 320 280 C 300 305 285 330 265 350 Z" fill="#171d33"/>
  <!-- rim light right side -->
  <path d="M520 260 C 560 310 560 400 520 460" fill="none" stroke="url(#rim)" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M560 640 C 590 680 605 730 610 780" fill="none" stroke="url(#rim)" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  <!-- soft face shadow left -->
  <ellipse cx="330" cy="380" rx="60" ry="90" fill="#10152a" opacity="0.35"/>
  <!-- vignette -->
  <rect width="800" height="800" fill="black" opacity="0.12"/>
</svg>
